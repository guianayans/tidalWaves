# Traefik file provider — substituir __APP_*__ (mesmos valores do docker-compose.yml)
# Referência: server-app-base/INSTRUCOES-PARA-IA.md

http:
  routers:
    __APP_SLUG__:
      rule: 'Host(`__APP_DOMAIN__`) || Host(`www.__APP_DOMAIN__`)'
      entryPoints:
        - https
      service: __APP_SLUG__-svc
      middlewares:
        - __APP_SLUG__-sec
      tls: {}
  middlewares:
    __APP_SLUG__-sec:
      headers:
        forceSTSHeader: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        customResponseHeaders:
          X-Frame-Options: DENY
          Cross-Origin-Resource-Policy: same-site
          Permissions-Policy: 'camera=(), microphone=(), geolocation=()'
  services:
    __APP_SLUG__-svc:
      loadBalancer:
        servers:
          - url: 'http://__APP_SLUG__:__APP_PORT__'
