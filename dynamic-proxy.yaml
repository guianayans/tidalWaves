# tidalWaves — Traefik file-provider config (only needed if using the file
# provider instead of the docker-compose labels above; labels already suffice).
http:
  routers:
    tidalwaves:
      rule: 'Host(`tidalwaves.gvtserver.online`) || Host(`www.tidalwaves.gvtserver.online`)'
      entryPoints:
        - https
      service: tidalwaves-svc
      middlewares:
        - tidalwaves-sec
      tls: {}
  middlewares:
    tidalwaves-sec:
      headers:
        forceSTSHeader: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        customResponseHeaders:
          X-Frame-Options: DENY
          Cross-Origin-Resource-Policy: same-site
          Permissions-Policy: 'camera=(), microphone=(), geolocation=()'
  services:
    tidalwaves-svc:
      loadBalancer:
        servers:
          - url: 'http://tidalwaves:4025'
